version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Packaging ThermalMatch for AWS Amplify Production..."
  artifacts:
    baseDirectory: frontend
    files:
      - '**/*'
  cache:
    paths: []
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Content-Security-Policy'
        value: "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://*.quicksight.aws.amazon.com https://generativelanguage.googleapis.com data:; img-src 'self' data: https:;"
